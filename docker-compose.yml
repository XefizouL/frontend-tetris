version: '3.8'

services:
  # --- COLUMNA 3: ENTRADA (AWS ALB Equivalent) ---
  reverse-proxy:
    image: nginx:alpine
    container_name: tetris-entry-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - tetris-frontend
      - tetris-api
      - tetris-websocket
    networks:
      - tetris-network
    restart: always

  # --- COLUMNA 4: FRONTEND ---
  tetris-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tetris-frontend-client
    environment:
      - PORT=3000
    networks:
      - tetris-network
    restart: always

  # --- COLUMNA 5: CONTENEDORES (API Backend) ---
  tetris-api:
    build:
      context: ./api
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://postgres:securepassword@tetris-db:5432/tetris
      - REDIS_URL=redis://tetris-cache:6379/0
    deploy:
      replicas: 2
    depends_on:
      - tetris-db
      - tetris-cache
    networks:
      - tetris-network
    restart: always

  # --- COLUMNA 5: CONTENEDORES (WEBSOCKETS) ---
  tetris-websocket:
    build:
      context: ./websocket
    environment:
      - PORT=4000
      - REDIS_URL=redis://tetris-cache:6379/0
      - QUEUE_URL=amqp://guest:guest@tetris-queue:5672
    deploy:
      replicas: 2
    depends_on:
      - tetris-cache
      - tetris-queue
    networks:
      - tetris-network
    restart: always

  # --- COLUMNA 5: CONTENEDORES (WORKERS ASÍNCRONOS) ---
  tetris-worker:
    build:
      context: ./workers
    environment:
      - DATABASE_URL=postgres://postgres:securepassword@tetris-db:5432/tetris
      - QUEUE_URL=amqp://guest:guest@tetris-queue:5672
    deploy:
      replicas: 3
    depends_on:
      - tetris-db
      - tetris-queue
    networks:
      - tetris-network
    restart: always

  # --- COLUMNA 6: DATOS Y MENSAJERÍA ---
  tetris-db:
    image: postgres:15-alpine
    container_name: tetris-rds-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=securepassword
      - POSTGRES_DB=tetris
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - tetris-network
    restart: always

  tetris-cache:
    image: redis:7-alpine
    container_name: tetris-elasticache-redis
    volumes:
      - redis-data:/data
    networks:
      - tetris-network
    restart: always

  tetris-queue:
    image: rabbitmq:3-management-alpine
    container_name: tetris-sqs-rabbitmq
    ports:
      - "15672:15672" # RabbitMQ panel
    networks:
      - tetris-network
    restart: always

  # --- COLUMNA 7: OBSERVABILIDAD ---
  prometheus:
    image: prom/prometheus:latest
    container_name: tetris-monitoring-metrics
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - tetris-network
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: tetris-monitoring-dashboard
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - tetris-network
    restart: always

volumes:
  postgres-data:
  redis-data:

networks:
  tetris-network:
    driver: bridge
